<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri Vue Template</title>
    <style>
      :root {
        font-family: 'Nunito Sans', 'Noto Sans SC', system-ui, sans-serif;
        color-scheme: light dark;
        background: transparent;
      }

      body {
        display: grid;
        place-items: center;

        min-height: 100vh;
        margin: 0;

        color: #172033;

        background: linear-gradient(135deg, #eef6ff 0%, #f8fbff 52%, #eef2ff 100%);
      }

      .splash {
        display: grid;
        gap: 18px;
        place-items: center;
        text-align: center;
      }

      .logo {
        width: 96px;
        height: 96px;
        border-radius: 28px;
        box-shadow: 0 24px 70px rgb(60 111 214 / 22%);
      }

      .title {
        margin: 0;
        font-size: 26px;
        font-weight: 850;
        letter-spacing: 0.12em;
      }

      .subtitle {
        margin: -8px 0 0;
        font-size: 13px;
        color: #61708a;
      }

      .loader {
        overflow: hidden;

        width: 112px;
        height: 4px;
        border-radius: 999px;

        background: rgb(80 128 230 / 14%);
      }

      .loader::before {
        content: '';

        display: block;

        width: 42%;
        height: 100%;
        border-radius: inherit;

        background: linear-gradient(90deg, #3f7cff, #7b61ff);

        animation: loading 1.1s ease-in-out infinite;
      }

      @keyframes loading {
        0% {
          transform: translateX(-100%);
        }

        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <main class="splash" aria-label="应用启动中">
      <img class="logo" src="/logo.png" alt="Tauri Vue Template" />
      <h1 class="title">Tauri Vue Template</h1>
      <p class="subtitle">正在准备模板应用...</p>
      <div class="loader" aria-hidden="true"></div>
    </main>
  </body>
</html>
